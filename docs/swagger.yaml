  /auth/users:
    get:
      description: Lấy danh sách người dùng kèm vai trò (role), hỗ trợ tìm kiếm và
        phân trang bằng limit & offset
      parameters:
      - description: 'Số bản ghi cần lấy (default: 10, max: 50)'
        in: query
        name: limit
        type: integer
      - description: 'Số bản ghi cần bỏ qua (default: 0)'
        in: query
        name: offset
        type: integer
      - description: Từ khóa tìm kiếm (theo username, email hoặc họ và tên)
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserPaginationResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
