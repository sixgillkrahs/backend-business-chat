basePath: /v1/api
definitions:
  domain.Action:
    properties:
      code:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      updated_at:
        type: string
    type: object
  domain.Policy:
    properties:
      action_id:
        type: integer
      action_name:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      resource_id:
        type: integer
      resource_name:
        type: string
      updated_at:
        type: string
    type: object
  domain.Resource:
    properties:
      code:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      updated_at:
        type: string
    type: object
  dto.CreatePermissionRequest:
    properties:
      description:
        maxLength: 255
        type: string
      name:
        maxLength: 50
        minLength: 3
        type: string
      policy_ids:
        items:
          type: integer
        minItems: 1
        type: array
    required:
      - name
      - policy_ids
    type: object
  dto.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
      - password
      - username
    type: object
  dto.PolicyPaginationResponse:
    properties:
      items:
        items:
          $ref: "#/definitions/domain.Policy"
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  dto.PolicyRequest:
    properties:
      action_id:
        type: integer
      description:
        type: string
      idempotence_key:
        type: string
      name:
        type: string
      resource_id:
        type: integer
    required:
      - action_id
      - idempotence_key
      - name
      - resource_id
    type: object
  dto.UpdatePolicyRequest:
    properties:
      action_id:
        type: integer
      description:
        type: string
      name:
        type: string
      resource_id:
        type: integer
    type: object
host: localhost:8081
info:
  contact:
    email: support@sixgillkrahs.com
    name: API Support
  description: API server cho hệ thống Business Chat.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Backend Business Chat API
  version: "1.0"
paths:
  /auth/actions:
    get:
      description: Lấy toàn bộ danh sách actions trong hệ thống
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: "#/definitions/domain.Action"
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
        - BearerAuth: []
      summary: Danh sách actions
      tags:
        - auth
  /auth/login:
    post:
      consumes:
        - application/json
      description: Xác thực người dùng và trả về JWT token
      parameters:
        - description: Thông tin đăng nhập
          in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/dto.LoginRequest"
      produces:
        - application/json
      responses:
        "200":
          description: access_token
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Đăng nhập
      tags:
        - auth
  /auth/permissions:
    post:
      consumes:
        - application/json
      description: Tạo một permission mới liên kết với nhiều policy IDs
      parameters:
        - description: Thông tin permission và danh sách policy IDs
          in: body
          name: request
          required: true
          schema:
            $ref: "#/definitions/dto.CreatePermissionRequest"
      produces:
        - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
        - BearerAuth: []
      summary: Tạo permission mới
      tags:
        - auth
  /auth/policies:
    get:
      description: Lấy danh sách policies với pagination và tìm kiếm
      parameters:
        - description: "Trang hiện tại (default: 1)"
          in: query
          name: page
          type: integer
        - description: "Số bản ghi mỗi trang (default: 10, max: 50)"
          in: query
          name: limit
          type: integer
        - description: Từ khóa tìm kiếm (theo tên hoặc mô tả)
          in: query
          name: search
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/dto.PolicyPaginationResponse"
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
        - BearerAuth: []
      summary: Danh sách policies (phân trang và tìm kiếm)
      tags:
        - auth
    post:
      consumes:
        - application/json
      description: Tạo một policy phân quyền mới
      parameters:
        - description: Thông tin policy
          in: body
          name: request
          required: true
          schema:
            $ref: "#/definitions/dto.PolicyRequest"
      produces:
        - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
        - BearerAuth: []
      summary: Tạo policy mới
      tags:
        - auth
  /auth/policies/{id}:
    delete:
      description: Xóa một policy khỏi hệ thống theo ID
      parameters:
        - description: ID của policy
          in: path
          name: id
          required: true
          type: integer
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
        - BearerAuth: []
      summary: Xóa policy theo ID
      tags:
        - auth
    get:
      description: Lấy thông tin chi tiết của một policy theo ID
      parameters:
        - description: ID của policy
          in: path
          name: id
          required: true
          type: integer
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/domain.Policy"
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
        - BearerAuth: []
      summary: Chi tiết policy theo ID
      tags:
        - auth
    put:
      consumes:
        - application/json
      description: Cập nhật thông tin của một policy theo ID
      parameters:
        - description: ID của policy
          in: path
          name: id
          required: true
          type: integer
        - description: Thông tin cập nhật policy
          in: body
          name: request
          required: true
          schema:
            $ref: "#/definitions/dto.UpdatePolicyRequest"
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/domain.Policy"
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
        - BearerAuth: []
      summary: Cập nhật policy theo ID
      tags:
        - auth
  /auth/resources:
    get:
      description: Lấy toàn bộ danh sách resources trong hệ thống
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: "#/definitions/domain.Resource"
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
        - BearerAuth: []
      summary: Danh sách resources
      tags:
        - auth
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
