      - BearerAuth: []
      summary: Danh sách users (phân trang limit & offset)
      tags:
      - auth
    post:
      consumes:
      - application/json
      description: Tạo tài khoản người dùng mới cùng với thông tin đăng nhập và lưu
        lịch sử mật khẩu theo chuẩn OWASP
      parameters:
      - description: Thông tin người dùng mới
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/domain.User'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/utils.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Tạo người dùng mới
      tags:
      - auth
  /auth/users/{id}:
    delete:
      description: Xóa mềm (soft delete) tài khoản người dùng theo ID theo chuẩn OWASP
        (không cho phép xóa tài khoản quản trị hệ thống hoặc tự xóa tài khoản của
        chính mình)
      parameters:
      - description: ID của người dùng cần xóa
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Xóa người dùng theo ID
      tags:
      - auth
    get:
      description: Lấy thông tin chi tiết người dùng kèm vai trò (role) theo ID
      parameters:
      - description: ID của người dùng
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.User'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Chi tiết người dùng theo ID
      tags:
      - auth
    put:
      consumes:
      - application/json
      description: Chỉnh sửa thông tin hồ sơ, vai trò hoặc trạng thái hoạt động của
        người dùng theo chuẩn OWASP
      parameters:
      - description: ID của người dùng cần cập nhật
        in: path
        name: id
        required: true
        type: integer
      - description: Thông tin cập nhật người dùng
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.User'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Cập nhật thông tin người dùng theo ID
      tags:
      - auth
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
