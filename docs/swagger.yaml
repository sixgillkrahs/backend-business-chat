basePath: /v1/api
definitions:
  domain.Action:
    properties:
      code:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      updated_at:
        type: string
    type: object
  domain.Auth:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      deleted_at:
        type: string
      deleted_by:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      is_deleted:
        type: boolean
      password_hash:
        type: string
      role_id:
        type: integer
      updated_at:
        type: string
      updated_by:
        type: string
      user_id:
        type: integer
      username:
        type: string
    type: object
  domain.GitHubCreateIssueRequest:
    properties:
      assignees:
        items:
          type: string
        type: array
      body:
        type: string
      labels:
        items:
          type: string
        type: array
      title:
        type: string
    required:
    - title
    type: object
  domain.GitHubIssueResponse:
    properties:
      html_url:
        type: string
      id:
        type: integer
      number:
        type: integer
      state:
        type: string
      title:
        type: string
    type: object
  domain.GitHubRepository:
    properties:
      default_branch:
        type: string
      description:
        type: string
      full_name:
        type: string
      html_url:
        type: string
      id:
        type: integer
      name:
        type: string
      private:
        type: boolean
    type: object
  domain.Permission:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      policies:
        items:
          $ref: '#/definitions/domain.Policy'
        type: array
      updated_at:
        type: string
    type: object
  domain.Policy:
    properties:
      action_id:
        type: integer
      action_name:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      resource_id:
        type: integer
      resource_name:
        type: string
      updated_at:
        type: string
    type: object
  domain.Resource:
    properties:
      code:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      updated_at:
        type: string
    type: object
  domain.Role:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      is_system:
        type: boolean
      name:
        type: string
      permissions:
        items:
          $ref: '#/definitions/domain.Permission'
        type: array
      updated_at:
        type: string
    type: object
  domain.User:
    properties:
      address:
        type: string
      auth:
        $ref: '#/definitions/domain.Auth'
      avatar_url:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      deleted_at:
        type: string
      deleted_by:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      is_deleted:
        type: boolean
      phone_number:
        type: string
      role:
        $ref: '#/definitions/domain.Role'
      role_id:
        type: integer
      updated_at:
        type: string
      updated_by:
        type: string
      username:
        type: string
    type: object
  dto.CreatePermissionRequest:
    properties:
      description:
        maxLength: 255
        type: string
      name:
        maxLength: 50
        minLength: 3
        type: string
      policy_ids:
        items:
          type: integer
        minItems: 1
        type: array
    required:
    - name
    - policy_ids
    type: object
  dto.CreateRoleRequest:
    properties:
      description:
        maxLength: 255
        type: string
      is_active:
        type: boolean
      name:
        maxLength: 50
        minLength: 3
        type: string
      permission_ids:
        items:
          type: integer
        minItems: 1
        type: array
    required:
    - name
    - permission_ids
    type: object
  dto.CreateUserRequest:
    properties:
      address:
        maxLength: 255
        type: string
      avatar_url:
        maxLength: 255
        type: string
      email:
        maxLength: 100
        type: string
      full_name:
        maxLength: 100
        minLength: 1
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
      phone_number:
        maxLength: 20
        type: string
      role_id:
        type: integer
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - full_name
    - password
    - role_id
    - username
    type: object
  dto.GitHubAuthURLResponse:
    properties:
      state:
        type: string
      url:
        type: string
    type: object
  dto.GitHubOAuthCallbackRequest:
    properties:
      code:
        type: string
      state:
        type: string
    required:
    - code
    - state
    type: object
  dto.LoginRequest:
    properties:
      password:
        maxLength: 72
        minLength: 6
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  dto.LoginResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
      user:
        $ref: '#/definitions/dto.UserLoginResponse'
    type: object
  dto.PermissionPaginationResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/domain.Permission'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  dto.PolicyPaginationResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/domain.Policy'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  dto.PolicyRequest:
    properties:
      action_id:
        type: integer
      description:
        type: string
      idempotence_key:
        type: string
      name:
        type: string
      resource_id:
        type: integer
    required:
    - action_id
    - idempotence_key
    - name
    - resource_id
    type: object
  dto.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    type: object
  dto.RegisterRequest:
    properties:
      address:
        maxLength: 255
        type: string
      avatar_url:
        maxLength: 255
        type: string
      email:
        maxLength: 100
        type: string
      full_name:
        maxLength: 100
        minLength: 1
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
      phone_number:
        maxLength: 20
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - full_name
    - password
    - username
    type: object
  dto.RolePaginationResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/domain.Role'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  dto.RoleResponse:
    properties:
      description:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      is_system:
        type: boolean
      name:
        type: string
      permission_ids:
        items:
          type: integer
        type: array
    type: object
  dto.UpdatePermissionRequest:
    properties:
      description:
        maxLength: 255
        type: string
      name:
        maxLength: 50
        minLength: 3
        type: string
      policy_ids:
        items:
          type: integer
        minItems: 1
        type: array
    type: object
  dto.UpdatePolicyRequest:
    properties:
      action_id:
        type: integer
      description:
        type: string
      name:
        type: string
      resource_id:
        type: integer
    type: object
  dto.UpdateRoleRequest:
    properties:
      description:
        maxLength: 255
        type: string
      is_active:
        type: boolean
      name:
        maxLength: 50
        minLength: 3
        type: string
      permission_ids:
        items:
          type: integer
        type: array
    type: object
  dto.UpdateRoleStatusRequest:
    properties:
      is_active:
        type: boolean
    type: object
  dto.UpdateUserRequest:
    properties:
      address:
        maxLength: 255
        type: string
      avatar_url:
        maxLength: 255
        type: string
      email:
        maxLength: 100
        type: string
      full_name:
        maxLength: 100
        minLength: 1
        type: string
      is_active:
        type: boolean
      phone_number:
        maxLength: 20
        type: string
      role_id:
        type: integer
      username:
        maxLength: 50
        minLength: 3
        type: string
    type: object
  dto.UserLoginResponse:
    properties:
      avatar_url:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: integer
      permissions:
        items:
          $ref: '#/definitions/domain.Permission'
        type: array
      role:
        $ref: '#/definitions/dto.RoleResponse'
      username:
        type: string
    type: object
  dto.UserPaginationResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/domain.User'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  utils.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
host: localhost:8000
info:
  contact:
    email: support@sixgillkrahs.com
    name: API Support
  description: API server cho hệ thống Business Chat.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Backend Business Chat API
  version: "1.0"
paths:
  /auth/actions:
    get:
      description: Lấy toàn bộ danh sách actions trong hệ thống
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Action'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Danh sách actions
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Xác thực thông tin tài khoản người dùng, chống tấn công dò quét
        (OWASP Anti-Enumeration & Timing Attack mitigation) và trả về JWT Bearer token
        kèm thông tin người dùng và quyền hạn
      parameters:
      - description: Thông tin đăng nhập
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Thông tin phiên đăng nhập, access token và quyền người dùng
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Đăng nhập hệ thống
      tags:
      - auth
  /auth/oauth/github:
    post:
      consumes:
      - application/json
      description: Nhận mã ủy quyền (code) và state từ GitHub hoặc client SPA, xác
        thực chống tấn công CSRF, đồng thời tự động tạo tài khoản hoặc liên kết tài
        khoản và trả về cặp JWT tokens (Access Token 15m & Refresh Token 7d)
      parameters:
      - description: Mã ủy quyền code và state (dạng JSON)
        in: body
        name: body
        schema:
          $ref: '#/definitions/dto.GitHubOAuthCallbackRequest'
      - description: Mã ủy quyền code (nếu redirect qua query params)
        in: query
        name: code
        type: string
      - description: Mã CSRF state (nếu redirect qua query params)
        in: query
        name: state
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Thông tin phiên đăng nhập và token
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Xác thực callback GitHub OAuth2 (Đăng nhập / Tạo tài khoản)
      tags:
      - auth
  /auth/oauth/github/callback:
    get:
      consumes:
      - application/json
      description: Nhận mã ủy quyền (code) và state từ GitHub hoặc client SPA, xác
        thực chống tấn công CSRF, đồng thời tự động tạo tài khoản hoặc liên kết tài
        khoản và trả về cặp JWT tokens (Access Token 15m & Refresh Token 7d)
      parameters:
      - description: Mã ủy quyền code và state (dạng JSON)
        in: body
        name: body
        schema:
          $ref: '#/definitions/dto.GitHubOAuthCallbackRequest'
      - description: Mã ủy quyền code (nếu redirect qua query params)
        in: query
        name: code
        type: string
      - description: Mã CSRF state (nếu redirect qua query params)
        in: query
        name: state
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Thông tin phiên đăng nhập và token
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Xác thực callback GitHub OAuth2 (Đăng nhập / Tạo tài khoản)
      tags:
      - auth
  /auth/oauth/github/repos:
    get:
      description: Sử dụng GitHub OAuth access token được mã hóa an toàn của người
        dùng trong hệ thống để truy xuất danh sách repository
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/domain.GitHubRepository'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Lấy danh sách repositories của người dùng từ GitHub
      tags:
      - auth
  /auth/oauth/github/repos/{owner}/{repo}/issues:
    post:
      consumes:
      - application/json
      description: Sử dụng GitHub OAuth access token được mã hóa của người dùng để
        tạo issue mới trên repository chỉ định
      parameters:
      - description: Chủ sở hữu repository (username hoặc org)
        in: path
        name: owner
        required: true
        type: string
      - description: Tên repository
        in: path
        name: repo
        required: true
        type: string
      - description: Thông tin issue cần tạo
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.GitHubCreateIssueRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/domain.GitHubIssueResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Tạo issue mới trên GitHub repository của người dùng
      tags:
      - auth
  /auth/oauth/github/url:
    get:
      description: Khởi tạo luồng xác thực OAuth2 với GitHub, tạo mã CSRF state ngẫu
        nhiên có chữ ký số (HMAC) theo chuẩn OWASP và trả về URL để client chuyển
        hướng đến GitHub
      produces:
      - application/json
      responses:
        "200":
          description: URL ủy quyền và mã state chống CSRF
          schema:
            $ref: '#/definitions/dto.GitHubAuthURLResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Lấy URL ủy quyền GitHub OAuth2
      tags:
      - auth
  /auth/permissions:
    get:
      description: Lấy danh sách permissions kèm danh sách các policy của mỗi permission,
        hỗ trợ tìm kiếm và phân trang bằng limit & offset
      parameters:
      - description: 'Số bản ghi cần lấy (default: 10, max: 50)'
        in: query
        name: limit
        type: integer
      - description: 'Số bản ghi cần bỏ qua (default: 0)'
        in: query
        name: offset
        type: integer
      - description: Từ khóa tìm kiếm (theo tên hoặc mô tả)
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PermissionPaginationResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Danh sách permissions (phân trang limit & offset)
      tags:
      - auth
    post:
      consumes:
      - application/json
      description: Tạo một permission mới liên kết với nhiều policy IDs
      parameters:
      - description: Thông tin permission và danh sách policy IDs
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreatePermissionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Tạo permission mới
      tags:
      - auth
  /auth/permissions/{id}:
    delete:
      description: Xóa một permission và các liên kết policies khỏi hệ thống theo
        ID
      parameters:
      - description: ID của permission
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Xóa permission theo ID
      tags:
      - auth
    get:
      description: Lấy thông tin chi tiết của một permission kèm danh sách policies
        theo ID
      parameters:
      - description: ID của permission
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Permission'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Chi tiết permission theo ID
      tags:
      - auth
    put:
      consumes:
      - application/json
      description: Cập nhật thông tin của một permission và danh sách policies theo
        ID
      parameters:
      - description: ID của permission
        in: path
        name: id
        required: true
        type: integer
      - description: Thông tin cập nhật permission
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdatePermissionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Permission'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Cập nhật permission theo ID
      tags:
      - auth
  /auth/policies:
    get:
      description: Lấy danh sách policies với pagination và tìm kiếm
      parameters:
      - description: 'Trang hiện tại (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Số bản ghi mỗi trang (default: 10, max: 50)'
        in: query
        name: limit
        type: integer
      - description: Từ khóa tìm kiếm (theo tên hoặc mô tả)
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PolicyPaginationResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Danh sách policies (phân trang và tìm kiếm)
      tags:
      - auth
    post:
      consumes:
      - application/json
      description: Tạo một policy phân quyền mới
      parameters:
      - description: Thông tin policy
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.PolicyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Tạo policy mới
      tags:
      - auth
  /auth/policies/{id}:
    delete:
      description: Xóa một policy khỏi hệ thống theo ID
      parameters:
      - description: ID của policy
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Xóa policy theo ID
      tags:
      - auth
    get:
      description: Lấy thông tin chi tiết của một policy theo ID
      parameters:
      - description: ID của policy
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Policy'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Chi tiết policy theo ID
      tags:
      - auth
    put:
      consumes:
      - application/json
      description: Cập nhật thông tin của một policy theo ID
      parameters:
      - description: ID của policy
        in: path
        name: id
        required: true
        type: integer
      - description: Thông tin cập nhật policy
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdatePolicyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Policy'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Cập nhật policy theo ID
      tags:
      - auth
  /auth/refresh-token:
    post:
      consumes:
      - application/json
      description: Cấp lại Access Token mới (15 phút) và xoay vòng Refresh Token (Refresh
        Token Rotation - RTR) theo chuẩn OWASP. Hỗ trợ nhận token qua JSON body hoặc
        HttpOnly Cookie.
      parameters:
      - description: Refresh token (tùy chọn nếu đã lưu trong HttpOnly Cookie)
        in: body
        name: body
        schema:
          $ref: '#/definitions/dto.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Cặp access token và refresh token mới được cấp kèm thông tin
            người dùng
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Làm mới access token (Refresh Token)
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Tạo tài khoản người dùng mới theo chuẩn bảo mật OWASP ASVS (chống
        leo thang đặc quyền, chính sách mật khẩu mạnh, chống timing attack và lưu
        vết lịch sử mật khẩu)
      parameters:
      - description: Thông tin đăng ký tài khoản
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/domain.User'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/utils.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Response'
      summary: Đăng ký tài khoản người dùng mới
      tags:
      - auth
  /auth/resources:
    get:
      description: Lấy toàn bộ danh sách resources trong hệ thống
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Resource'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Danh sách resources
      tags:
      - auth
  /auth/roles:
    get:
      description: Lấy danh sách roles kèm permissions với pagination và tìm kiếm
      parameters:
      - description: 'Trang hiện tại (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Số bản ghi mỗi trang (default: 10, max: 50)'
        in: query
