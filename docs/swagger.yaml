basePath: /v1/api
definitions:
  github_com_sixgillkrahs_backend-business-chat_internal_application_dto.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  github_com_sixgillkrahs_backend-business-chat_internal_domain.Action:
    properties:
      code:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      updated_at:
        type: string
    type: object
  github_com_sixgillkrahs_backend-business-chat_internal_domain.Resource:
    properties:
      code:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      updated_at:
        type: string
    type: object
host: localhost:8081
info:
  contact:
    email: support@sixgillkrahs.com
    name: API Support
  description: API server cho hệ thống Business Chat.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Backend Business Chat API
  version: "1.0"
paths:
  /auth/actions:
    get:
      description: Lấy toàn bộ danh sách actions trong hệ thống
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_sixgillkrahs_backend-business-chat_internal_domain.Action'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Danh sách actions
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Xác thực người dùng và trả về JWT token
      parameters:
      - description: Thông tin đăng nhập
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_sixgillkrahs_backend-business-chat_internal_application_dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: access_token
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Đăng nhập
      tags:
      - auth
  /auth/policies:
    get:
      description: Lấy danh sách policies với pagination
      parameters:
      - description: 'Trang hiện tại (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Số bản ghi mỗi trang (default: 10)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Danh sách policies (phân trang)
      tags:
      - auth
    post:
      consumes:
      - application/json
      description: Tạo một policy phân quyền mới
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Tạo policy mới
      tags:
      - auth
  /auth/resources:
    get:
      description: Lấy toàn bộ danh sách resources trong hệ thống
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_sixgillkrahs_backend-business-chat_internal_domain.Resource'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Danh sách resources
      tags:
      - auth
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
