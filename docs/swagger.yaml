basePath: /v1/api
definitions:
  domain.Action:
    properties:
      code:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      updated_at:
        type: string
    type: object
  domain.Auth:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      deleted_at:
        type: string
      deleted_by:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      is_deleted:
        type: boolean
      password_hash:
        type: string
      role_id:
        type: integer
      updated_at:
        type: string
      updated_by:
        type: string
      user_id:
        type: integer
      username:
        type: string
    type: object
  domain.Permission:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      policies:
        items:
          $ref: '#/definitions/domain.Policy'
        type: array
      updated_at:
        type: string
    type: object
  domain.Policy:
    properties:
      action_id:
        type: integer
      action_name:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      resource_id:
        type: integer
      resource_name:
        type: string
      updated_at:
        type: string
    type: object
  domain.Resource:
    properties:
      code:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      updated_at:
        type: string
    type: object
  domain.Role:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      is_system:
        type: boolean
      name:
        type: string
      permissions:
        items:
          $ref: '#/definitions/domain.Permission'
        type: array
      updated_at:
        type: string
    type: object
  domain.User:
    properties:
      address:
        type: string
      auth:
        $ref: '#/definitions/domain.Auth'
      avatar_url:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      deleted_at:
        type: string
      deleted_by:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      is_deleted:
        type: boolean
      phone_number:
        type: string
      role:
        $ref: '#/definitions/domain.Role'
      role_id:
        type: integer
      updated_at:
        type: string
      updated_by:
        type: string
      username:
        type: string
    type: object
  dto.CreatePermissionRequest:
    properties:
      description:
        maxLength: 255
        type: string
      name:
        maxLength: 50
        minLength: 3
        type: string
      policy_ids:
        items:
          type: integer
        minItems: 1
        type: array
    required:
    - name
    - policy_ids
    type: object
  dto.CreateRoleRequest:
    properties:
      description:
        maxLength: 255
        type: string
      is_active:
        type: boolean
      name:
        maxLength: 50
        minLength: 3
        type: string
      permission_ids:
        items:
          type: integer
        minItems: 1
        type: array
    required:
    - name
    - permission_ids
    type: object
  dto.CreateUserRequest:
    properties:
      address:
        maxLength: 255
        type: string
      avatar_url:
        maxLength: 255
        type: string
      email:
        maxLength: 100
        type: string
      full_name:
        maxLength: 100
        minLength: 1
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
      phone_number:
        maxLength: 20
        type: string
      role_id:
        type: integer
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - full_name
    - password
    - role_id
    - username
    type: object
  dto.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  dto.PermissionPaginationResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/domain.Permission'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  dto.PolicyPaginationResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/domain.Policy'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  dto.PolicyRequest:
    properties:
      action_id:
        type: integer
      description:
        type: string
      idempotence_key:
        type: string
      name:
        type: string
      resource_id:
        type: integer
    required:
    - action_id
    - idempotence_key
    - name
    - resource_id
    type: object
  dto.RolePaginationResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/domain.Role'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  dto.UpdatePermissionRequest:
    properties:
      description:
        maxLength: 255
        type: string
      name:
        maxLength: 50
        minLength: 3
        type: string
      policy_ids:
        items:
          type: integer
        minItems: 1
        type: array
    type: object
  dto.UpdatePolicyRequest:
    properties:
      action_id:
        type: integer
      description:
        type: string
      name:
        type: string
      resource_id:
        type: integer
    type: object
  dto.UpdateRoleRequest:
    properties:
      description:
        maxLength: 255
        type: string
      is_active:
        type: boolean
      name:
        maxLength: 50
        minLength: 3
        type: string
      permission_ids:
        items:
          type: integer
        type: array
    type: object
  dto.UpdateRoleStatusRequest:
    properties:
      is_active:
        type: boolean
    type: object
  dto.UpdateUserRequest:
    properties:
      address:
        maxLength: 255
        type: string
      avatar_url:
        maxLength: 255
        type: string
      email:
        maxLength: 100
        type: string
      full_name:
        maxLength: 100
        minLength: 1
        type: string
      is_active:
        type: boolean
      phone_number:
        maxLength: 20
        type: string
      role_id:
        type: integer
      username:
        maxLength: 50
        minLength: 3
        type: string
    type: object
  dto.UserPaginationResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/domain.User'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  utils.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
host: localhost:8000
info:
  contact:
    email: support@sixgillkrahs.com
    name: API Support
  description: API server cho hệ thống Business Chat.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Backend Business Chat API
  version: "1.0"
paths:
  /auth/actions:
    get:
      description: Lấy toàn bộ danh sách actions trong hệ thống
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Action'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Danh sách actions
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Xác thực người dùng và trả về JWT token
      parameters:
      - description: Thông tin đăng nhập
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: access_token
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Đăng nhập
      tags:
      - auth
  /auth/permissions:
    get:
      description: Lấy danh sách permissions kèm danh sách các policy của mỗi permission,
        hỗ trợ tìm kiếm và phân trang bằng limit & offset
      parameters:
      - description: 'Số bản ghi cần lấy (default: 10, max: 50)'
        in: query
        name: limit
        type: integer
      - description: 'Số bản ghi cần bỏ qua (default: 0)'
        in: query
        name: offset
        type: integer
      - description: Từ khóa tìm kiếm (theo tên hoặc mô tả)
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PermissionPaginationResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Danh sách permissions (phân trang limit & offset)
      tags:
      - auth
    post:
      consumes:
      - application/json
      description: Tạo một permission mới liên kết với nhiều policy IDs
      parameters:
      - description: Thông tin permission và danh sách policy IDs
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreatePermissionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Tạo permission mới
      tags:
      - auth
  /auth/permissions/{id}:
    delete:
      description: Xóa một permission và các liên kết policies khỏi hệ thống theo
        ID
      parameters:
      - description: ID của permission
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Xóa permission theo ID
      tags:
      - auth
    get:
      description: Lấy thông tin chi tiết của một permission kèm danh sách policies
        theo ID
      parameters:
      - description: ID của permission
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Permission'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Chi tiết permission theo ID
      tags:
      - auth
    put:
      consumes:
      - application/json
      description: Cập nhật thông tin của một permission và danh sách policies theo
        ID
      parameters:
      - description: ID của permission
        in: path
        name: id
        required: true
        type: integer
      - description: Thông tin cập nhật permission
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdatePermissionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Permission'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Cập nhật permission theo ID
      tags:
      - auth
  /auth/policies:
    get:
      description: Lấy danh sách policies với pagination và tìm kiếm
      parameters:
      - description: 'Trang hiện tại (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Số bản ghi mỗi trang (default: 10, max: 50)'
        in: query
        name: limit
        type: integer
      - description: Từ khóa tìm kiếm (theo tên hoặc mô tả)
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PolicyPaginationResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Danh sách policies (phân trang và tìm kiếm)
      tags:
      - auth
    post:
      consumes:
      - application/json
      description: Tạo một policy phân quyền mới
      parameters:
      - description: Thông tin policy
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.PolicyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Tạo policy mới
      tags:
      - auth
  /auth/policies/{id}:
    delete:
      description: Xóa một policy khỏi hệ thống theo ID
      parameters:
      - description: ID của policy
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Xóa policy theo ID
      tags:
      - auth
    get:
      description: Lấy thông tin chi tiết của một policy theo ID
      parameters:
      - description: ID của policy
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Policy'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Chi tiết policy theo ID
      tags:
      - auth
    put:
      consumes:
      - application/json
      description: Cập nhật thông tin của một policy theo ID
      parameters:
      - description: ID của policy
        in: path
        name: id
        required: true
        type: integer
      - description: Thông tin cập nhật policy
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdatePolicyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Policy'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Cập nhật policy theo ID
      tags:
      - auth
  /auth/resources:
    get:
      description: Lấy toàn bộ danh sách resources trong hệ thống
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Resource'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Danh sách resources
      tags:
      - auth
  /auth/roles:
    get:
      description: Lấy danh sách roles kèm permissions với pagination và tìm kiếm
      parameters:
      - description: 'Trang hiện tại (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Số bản ghi mỗi trang (default: 10, max: 50)'
        in: query
        name: limit
        type: integer
      - description: Từ khóa tìm kiếm (theo tên hoặc mô tả)
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.RolePaginationResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Danh sách roles (phân trang và tìm kiếm)
      tags:
      - auth
    post:
      consumes:
      - application/json
      description: Tạo một role mới liên kết với danh sách permission IDs
      parameters:
      - description: Thông tin role và danh sách permission IDs
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateRoleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Tạo role mới
      tags:
      - auth
  /auth/roles/{id}:
    delete:
      description: Xóa một vai trò (role) khỏi hệ thống theo ID (không thể xóa vai
        trò hệ thống hoặc vai trò đang được gán cho người dùng)
      parameters:
      - description: ID của role cần xóa
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Xóa role theo ID
      tags:
      - auth
    put:
      consumes:
      - application/json
      description: Cập nhật thông tin của một role và danh sách permissions theo ID
      parameters:
      - description: ID của role
        in: path
        name: id
        required: true
        type: integer
      - description: Thông tin cập nhật role
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Role'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Cập nhật role theo ID
      tags:
      - auth
  /auth/roles/{id}/deactivate:
    patch:
      description: Hủy kích hoạt một vai trò (role) trong hệ thống theo ID (không
        thể hủy kích hoạt vai trò hệ thống)
      parameters:
      - description: ID của role cần hủy kích hoạt
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Hủy kích hoạt role theo ID
      tags:
      - auth
  /auth/roles/{id}/status:
    patch:
      consumes:
      - application/json
      description: Chuyển đổi (toggle) hoặc cập nhật trạng thái hoạt động (active/inactive)
        của một vai trò (role) theo ID
      parameters:
      - description: ID của role
        in: path
        name: id
        required: true
        type: integer
      - description: Trạng thái mới (nếu không truyền is_active, hệ thống sẽ tự động
          đảo ngược trạng thái hiện tại)
        in: body
        name: request
        schema:
          $ref: '#/definitions/dto.UpdateRoleStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Role'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Chuyển trạng thái role theo ID
      tags:
      - auth
  /auth/users:
    get:
      description: Lấy danh sách người dùng kèm vai trò (role), hỗ trợ tìm kiếm và
        phân trang bằng limit & offset
      parameters:
      - description: 'Số bản ghi cần lấy (default: 10, max: 50)'
        in: query
        name: limit
        type: integer
      - description: 'Số bản ghi cần bỏ qua (default: 0)'
        in: query
        name: offset
        type: integer
      - description: Từ khóa tìm kiếm (theo username, email hoặc họ và tên)
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserPaginationResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Danh sách users (phân trang limit & offset)
      tags:
      - auth
    post:
      consumes:
      - application/json
      description: Tạo tài khoản người dùng mới cùng với thông tin đăng nhập và lưu
        lịch sử mật khẩu theo chuẩn OWASP
      parameters:
      - description: Thông tin người dùng mới
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/domain.User'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/utils.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Tạo người dùng mới
      tags:
      - auth
  /auth/users/{id}:
    delete:
      description: Xóa mềm (soft delete) tài khoản người dùng theo ID theo chuẩn OWASP
        (không cho phép xóa tài khoản quản trị hệ thống hoặc tự xóa tài khoản của
        chính mình)
      parameters:
      - description: ID của người dùng cần xóa
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Xóa người dùng theo ID
      tags:
      - auth
    get:
      description: Lấy thông tin chi tiết người dùng kèm vai trò (role) theo ID
      parameters:
      - description: ID của người dùng
        in: path
        name: id
